{% extends 'base.html' %}
{% block content %}
<div class="card narrow">
  <h2>Adjust stock: {{ product.name }}</h2>
  <p>Current quantity: {{ product.quantity }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Apply</button>
    <a href="{% url 'product_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
