{% extends 'base.html' %}
{% block content %}
<div class="card narrow">
  <h2>Create your account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Sign up</button>
  </form>
  <p>Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
